name: Windows Web

# The frontend ships as the native build (`build:native`, served from `/`),
# so lint and that build are what CI gates on. Run on Windows to match the
# supported installation path in bootstrap_windows.py.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint and native build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # TEMPORARY DIAGNOSTIC: surface eslint errors as annotations
      - name: Diagnose lint
        if: failure()
        shell: pwsh
        run: |
          npx eslint . --format json --output-file eslint.json; $code = $LASTEXITCODE
          $results = Get-Content eslint.json -Raw | ConvertFrom-Json
          $count = 0
          foreach ($file in $results) {
            foreach ($msg in $file.messages) {
              if ($msg.severity -eq 2 -and $count -lt 10) {
                $count++
                Write-Host "::error file=$($file.filePath),line=$($msg.line),col=$($msg.column)::$($msg.ruleId): $($msg.message)"
              }
            }
          }
          Write-Host "::error::eslint exit=$code files-with-errors=$(($results | Where-Object errorCount -gt 0).Count) total-errors=$(($results | Measure-Object errorCount -Sum).Sum)"

      - name: Build (native)
        run: npm run build:native
