version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      rjsf:
        patterns: ["@rjsf/*"]
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-scrollbar"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-zoom-pan-pinch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "monaco-editor"
        versions: [">=0.55.0"]
      - dependency-name: "i18next-cli"
        versions: [">1.5.11"]
      - dependency-name: "@rjsf/*"
        versions: ["6.11.0"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "@docusaurus/*"
    groups:
      docusaurus:
        patterns: ["@docusaurus/*"]
      docs-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "@docusaurus/*"
        update-types: ["version-update:semver-major"]
