[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "frigate-nvr"
version = "0.19.0"
requires-python = ">=3.11"

[project.optional-dependencies]
# onnxruntime and onnxruntime-directml both provide the onnxruntime import,
# so this extra replaces the requirements-windows.txt package instead of
# adding to it: pip install --editable . --no-deps --group ... is not used,
# bootstrap_windows.py --directml performs the swap.
windows-directml = ["onnxruntime-directml == 1.24.*"]

[tool.setuptools.packages.find]
include = ["frigate*"]

[tool.setuptools.package-data]
frigate = ["images/*.jpg", "images/*.png"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E711", "E712", "UP031", "UP032", "UP042", "G004"]
extend-select = ["I", "UP", "G", "ASYNC210", "B904"]
